[package]
name = "search_engine_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
rocket = { version = "0.5", features = ["json"] }

# Search Engine
tantivy = "0.22"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client & Web Crawling
reqwest = { version = "0.11", features = ["json", "gzip"] }
scraper = "0.20"
url = "2.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database & Storage
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
walkdir = "2.4"

# Rate Limiting & Queue
dashmap = "5.5"

# CORS
rocket_cors = "0.6"
